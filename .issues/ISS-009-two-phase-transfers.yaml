acceptance_criteria:
  - "Phase 1 (ship): locks origin balance, deducts origin physicalQty, marks serials IN_TRANSIT, sets order IN_TRANSIT, logs TRANSFER_OUT."
  - "Phase 2 (receive): locks transfer order + destination balance, credits destination location, marks serials AVAILABLE, sets order COMPLETED, logs TRANSFER_IN."
  - "Concurrent Phase 2 test ensures a transfer order cannot be received twice."


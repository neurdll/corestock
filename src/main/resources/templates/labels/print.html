<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Label — CoreStock</title>
    <style>
        .label-card { border: 1px solid #111827; padding: 1rem; width: 380px; font-family: system-ui, sans-serif; }
        .label-card h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
        .label-meta { font-size: 0.9rem; margin-bottom: 0.5rem; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
<div class="label-card">
    <h2 th:text="${product.sku + ' — ' + product.name}">SKU</h2>
    <div class="label-meta">
        <span th:if="${!#strings.isEmpty(lotNumber)}" th:text="'Lot: ' + ${lotNumber}"></span>
        <span th:if="${expiryDate != null}" th:text="' | Exp: ' + ${expiryDate}"></span>
    </div>
    <img th:src="@{/labels/code128.png(sku=${product.sku},lotNumber=${lotNumber})}" alt="Code 128 Barcode">
    <div th:text="${payload}" style="font-family: monospace; font-size: 0.85rem;"></div>
</div>
<p class="no-print"><button type="button" onclick="window.print()">Print Label</button></p>
</body>
</html>

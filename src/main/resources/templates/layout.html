<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} + ' — CoreStock'">CoreStock</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 1.5rem; color: #1f2937; }
        nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #d1d5db; flex-wrap: wrap; }
        nav a { text-decoration: none; color: #1d4ed8; font-weight: 600; }
        .flash-ok { padding: 0.6rem 1rem; background: #dcfce7; border: 1px solid #16a34a; margin-bottom: 1rem; }
        .flash-err { padding: 0.6rem 1rem; background: #fee2e2; border: 1px solid #dc2626; margin-bottom: 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #d1d5db; padding: 0.45rem 0.6rem; text-align: left; }
        form label { display: block; margin: 0.5rem 0; }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/}">Stock</a>
    <a th:href="@{/ops/receive}">Receive</a>
    <a th:href="@{/ops/dispatch}">Dispatch</a>
    <a th:href="@{/ops/adjust}">Adjust / Reserve</a>
    <a th:href="@{/ops/transfers}">Transfers</a>
    <a th:href="@{/kardex}">Kardex</a>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/warehouses}">Warehouses</a>
    <form th:action="@{/logout}" method="post" style="margin-left:auto"><button type="submit">Logout</button></form>
</nav>
<div th:if="${message}" class="flash-ok" th:text="${message}"></div>
<div th:if="${error}" class="flash-err" th:text="${error}"></div>
<main th:replace="${content}"></main>
<script th:src="@{/js/scanner.js}"></script>
</body>
</html>

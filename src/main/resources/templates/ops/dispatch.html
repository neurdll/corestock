<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page('Outbound Dispatch', ~{::section})}">
<body>
<section>
    <h1>Outbound Dispatch (FEFO / FIFO Picking)</h1>
    <form th:action="@{/ops/dispatch}" method="post" data-scan-form>
        <label>Scan / Enter SKU
            <input type="text" name="sku" list="skuList" data-scan-target="sku" autofocus required>
        </label>
        <datalist id="skuList">
            <option th:each="p : ${products}" th:value="${p.sku}" th:label="${p.name}"></option>
        </datalist>
        <label>Warehouse
            <select name="warehouseId" required>
                <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.code + ' - ' + w.name}"></option>
            </select>
        </label>
        <label>Specific Bin (optional)
            <select name="locationId">
                <option value="">Auto FEFO/FIFO</option>
                <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.warehouse.code + ' / ' + l.code}"></option>
            </select>
        </label>
        <label>Quantity <input type="number" step="0.0001" min="0.0001" name="quantity" required></label>
        <label>Lot Number (optional) <input type="text" name="lotNumber"></label>
        <label>Scan Serials (SERIAL SKUs)
            <textarea name="serialCodes" rows="3" data-scan-append></textarea>
        </label>
        <label>Reference SO <input type="text" name="referenceDoc"></label>
        <button type="submit">Dispatch Stock</button>
    </form>
</section>
</body>
</html>

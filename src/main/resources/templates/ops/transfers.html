<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page('Inter-Warehouse Transfers', ~{::section})}">
<body>
<section>
    <h1>Two-Phase Inter-Warehouse Transfers</h1>
    <form th:action="@{/ops/transfers/ship}" method="post">
        <label>Transfer # <input type="text" name="transferNumber" required></label>
        <label>SKU <input type="text" name="sku" list="skuList" required></label>
        <datalist id="skuList">
            <option th:each="p : ${products}" th:value="${p.sku}" th:label="${p.name}"></option>
        </datalist>
        <label>Source Bin
            <select name="sourceLocationId" required>
                <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.warehouse.code + ' / ' + l.code}"></option>
            </select>
        </label>
        <label>Destination Bin
            <select name="destLocationId" required>
                <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.warehouse.code + ' / ' + l.code}"></option>
            </select>
        </label>
        <label>Quantity <input type="number" step="0.0001" min="0.0001" name="quantity" required></label>
        <label>Lot Number <input type="text" name="lotNumber"></label>
        <label>Serials (SERIAL SKUs) <textarea name="serialCodes" rows="2"></textarea></label>
        <button type="submit">Ship (IN_TRANSIT)</button>
    </form>

    <h2>Transfer Orders</h2>
    <table>
        <thead>
        <tr><th>Transfer #</th><th>From</th><th>To</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody>
        <tr th:each="t : ${transfers}">
            <td th:text="${t.transferNumber}"></td>
            <td th:text="${t.sourceWarehouse.code}"></td>
            <td th:text="${t.destWarehouse.code}"></td>
            <td th:text="${t.status}"></td>
            <td>
                <form th:if="${t.status.name() == 'IN_TRANSIT'}"
                      th:action="@{/ops/transfers/{id}/receive(id=${t.id})}" method="post">
                    <button type="submit">Confirm Receipt</button>
                </form>
                <span th:if="${t.status.name() != 'IN_TRANSIT'}">Completed</span>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
